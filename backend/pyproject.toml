[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fortuner-crm"
version = "0.1.0"
description = "FORTUNER CRM — Campañas segmentadas sobre el ERP FORTUNER (ADVANTAGE / Publidata)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    # Sin el extra [standard]: trae pyyaml, que no tiene paquete listo para Python 3.15 y exige compilador de C++.
    "uvicorn>=0.30,<1",
    "duckdb>=1.1,<3",
    "pyarrow>=16,<27",
    "pydantic-settings>=2.4,<3",
    "pyodbc>=5.1,<6",
    "httpx>=0.27,<1",
    "orjson>=3.10,<4",
    "typer>=0.12,<1",
    "python-dotenv>=1.0,<2",
    # Fotos de producto: validar y convertir a WebP al importarlas (crm imagenes importar).
    "pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
crm = "crm.cli:app"

[tool.setuptools.packages.find]
include = ["crm*"]

[tool.setuptools.package-data]
crm = ["**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
